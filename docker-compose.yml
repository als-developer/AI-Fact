version: '3.8'

services:
  # Cloudflare Worker (API)
  api:
    build:
      context: .
      dockerfile: Dockerfile.cf
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=development
    env_file:
      - .env.local
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: npx wrangler dev --port 8787 --host 0.0.0.0

  # Redis (for development)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Database (PostgreSQL for development - alternatives to D1)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=truthengine
      - POSTGRES_PASSWORD=truthengine123
      - POSTGRES_DB=truthengine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthengine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage for development)
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  # Create buckets on startup
  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/documents --ignore-existing;
      mc mb local/assets --ignore-existing;
      mc mb local/backups --ignore-existing;
      exit 0;
      "

volumes:
  redis-data:
  postgres-data:
  minio-data:
